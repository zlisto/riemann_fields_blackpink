<title>Etale Cohomology</title>

<body>
<script>
// ───────────────────────────── helpers ─────────────────────────────
const range = (N, f) => Array.from({ length: N + 1 }, (_, k) => f(k / N));
function dashed(pts, c, w, a, dash = [8, 7]) {
  if (a <= 0) return;
  ctx.save(); ctx.setLineDash(dash); polyline(pts, c, w, a, 6); ctx.restore();
}
// A wobbly closed curve standing in for "a curve X".
const blob = (cx, cy, r, s0 = 0, s1 = 1, N = 200) => range(N, (s) => {
  const th = TAU * lerp(s0, s1, s);
  const rr = r * (1 + 0.12 * Math.sin(3 * th) + 0.06 * Math.cos(5 * th));
  return [cx + rr * Math.cos(th), cy - 0.8 * rr * Math.sin(th)];
});
// Draw a closed blob with small gaps (removed points) at the given parameters.
function punctured(cx, cy, r, holes, c, w, a) {
  if (a <= 0) return;
  const hs = [...holes].sort((x, y) => x - y), g = 0.012;
  for (let i = 0; i < hs.length; i++) {
    const s0 = hs[i] + g, s1 = (i + 1 < hs.length ? hs[i + 1] : hs[0] + 1) - g;
    polyline(blob(cx, cy, r, s0, s1, 80), c, w, a, 8);
  }
  for (const h of hs) { const [x, y] = blob(cx, cy, r, h, h, 1)[0]; ring(x, y, 6, c, a, 2); }
}
function square(S0, SZ, a) {
  if (a <= 0) return (u, v) => [S0[0] + u * SZ, S0[1] + SZ - v * SZ];
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(255,79,163,0.1)'; ctx.strokeStyle = 'rgba(255,79,163,0.7)'; ctx.lineWidth = 2;
  ctx.fillRect(S0[0], S0[1], SZ, SZ); ctx.strokeRect(S0[0], S0[1], SZ, SZ); ctx.restore();
  return (u, v) => [S0[0] + u * SZ, S0[1] + SZ - v * SZ];
}
function gridLines(sq, n, c, a, w = 1) {
  for (let k = 1; k < n; k++) {
    line(...sq(k / n, 0), ...sq(k / n, 1), c, w, a);
    line(...sq(0, k / n), ...sq(1, k / n), c, w, a);
  }
}

// ───────────────────────────── scenes ─────────────────────────────
const scenes = [
  {
    title: 'Intro',
    text: "Here's where we are. Weil's conjectures would follow from the Lefschetz formula, if only curves mod p had a cohomology: an H one of dimension two, with Frobenius acting on it. Over the complex numbers, H one comes from loops. But mod p, there are no loops to draw. In the early nineteen sixties, Alexander Grothendieck found a way around this, with Michael Artin and Jean-Louis Verdier. The trick is to stop looking at loops, and look at coverings instead.",
    draw(p) {
      txt('Étale cohomology', 640, 90, { size: 60, weight: 700, color: COL.pink, glow: 22, alpha: ease(seg(p, 0.0, 0.08)) });
      const wish = [['a cohomology for curves mod p', 0.08], ['H¹ of dimension 2', 0.16], ['Frobenius acts on it', 0.24]];
      wish.forEach(([s, at], i) => txt(`☐  ${s}`, 640, 190 + i * 50, { size: 28, color: COL.soft, alpha: ease(seg(p, at, at + 0.06)) }));
      txt('over ℂ: H¹ comes from loops', 640, 380, { size: 28, alpha: ease(seg(p, 0.36, 0.42)) });
      txt('mod p: no loops to draw', 640, 430, { size: 28, color: COL.dim, alpha: ease(seg(p, 0.44, 0.5)) });
      txt('Grothendieck (with Artin, Verdier), early 1960s', 640, 520, { size: 26, color: COL.lav, alpha: ease(seg(p, 0.58, 0.66)) });
      txt('stop looking at loops. look at coverings.', 640, 600, { size: 34, weight: 700, color: COL.pink, glow: 18, alpha: ease(seg(p, 0.84, 0.92)) });
    },
  },
  {
    title: 'Too few open sets',
    text: "Why is there no topology mod p? There is one, called the Zariski topology, but it's far too coarse. An open set is the whole curve with finitely many points removed. That's all. So any two open sets overlap almost everywhere. There are no small neighborhoods, no little disks, nothing you could use to trace out a loop. If you compute cohomology with these open sets, H one comes out zero. Every overlap is still one connected piece, so there's nowhere for a shift to hide. The curve looks like a blob with no holes at all.",
    draw(p) {
      const C = [400, 380], R = 200;
      const a0 = ease(seg(p, 0.04, 0.12));
      polyline(blob(...C, R), COL.white, 2, 0.3 * a0);
      txt('a curve mod p', C[0], C[1], { size: 22, color: COL.dim, alpha: a0 });
      const A = ease(seg(p, 0.18, 0.25)) * (1 - 0.6 * ease(seg(p, 0.36, 0.4)));
      punctured(...C, R, [0.08, 0.37, 0.71], COL.pink, 4, A);
      const B = ease(seg(p, 0.32, 0.4));
      punctured(...C, R + 22, [0.2, 0.52, 0.6, 0.9], COL.lav, 4, B);
      const RX = 960;
      txt('open set  =  curve − finitely many points', RX, 190, { size: 26, alpha: ease(seg(p, 0.2, 0.26)) });
      txt('two open sets overlap almost everywhere', RX, 250, { size: 24, color: COL.soft, alpha: ease(seg(p, 0.36, 0.42)) });
      txt('no small neighborhoods', RX, 310, { size: 24, color: COL.soft, alpha: ease(seg(p, 0.43, 0.49)) });
      txt('no loops', RX, 355, { size: 24, color: COL.soft, alpha: ease(seg(p, 0.51, 0.57)) });
      txt('H¹  =  0', RX, 430, { size: 46, font: MATH, weight: 700, color: COL.pink, glow: 18, alpha: ease(seg(p, 0.68, 0.73)) });
      txt('every overlap is one connected piece:', RX, 495, { size: 21, color: COL.lav, alpha: ease(seg(p, 0.73, 0.78)) });
      txt('nowhere for a shift to hide', RX, 527, { size: 21, color: COL.lav, alpha: ease(seg(p, 0.76, 0.81)) });
      txt('(Zariski topology: too coarse)', RX, 580, { size: 20, color: COL.dim, alpha: ease(seg(p, 0.88, 0.93)) });
    },
  },
  {
    title: 'Coverings detect holes',
    text: "Here's the key idea. Over the complex numbers, you can detect a hole without drawing any loop, using coverings. Take a circle, and a second circle that wraps around it twice, like z goes to z squared. Walk once around the bottom circle, and follow along upstairs. You don't come back to where you started: you land on the other sheet. That twist is the hole, showing up. Without a hole, a double cover would just fall apart into two separate copies. The twisted coverings, labelled by their shift, are H one. We'll build this carefully next.",
    draw(p, t) {
      const C = [420, 0], RX = 230, RY = 52;
      const base = (th) => [C[0] + RX * Math.cos(th), 560 + RY * Math.sin(th)];
      const up = (th) => [C[0] + RX * Math.cos(th), 340 + RY * Math.sin(th) - 70 * (th / TAU)];
      const a0 = ease(seg(p, 0.08, 0.16)), a1 = ease(seg(p, 0.2, 0.28));
      polyline(range(120, (s) => base(TAU * s)), COL.white, 3, a0, 6);
      txt('circle', C[0] + RX + 50, 560, { size: 22, color: COL.dim, alpha: a0 });
      polyline(range(240, (s) => up(2 * TAU * s)), COL.lav, 3, a1, 8);
      dashed([up(2 * TAU), up(0)], COL.lav, 2, 0.6 * a1);
      txt('wraps twice', C[0] + RX + 95, 270, { size: 22, color: COL.lav, alpha: a1 });
      txt('z ↦ z²', C[0] + RX + 95, 305, { size: 22, font: MATH, color: COL.lav, alpha: a1 });
      arrow(C[0] + RX + 95, 340, C[0] + RX + 95, 520, COL.dim, 2, a1);
      // walk
      if (p > 0.34) {
        const s = ease(seg(p, 0.36, 0.6));
        const th = TAU * s + Math.PI / 2;
        const B = base(th), U = up(th - Math.PI / 2 + Math.PI / 2 + 0) ;
        const U2 = up(TAU * s + Math.PI / 2);
        dashed([B, U2], COL.soft, 1.5, 0.6);
        polyline(range(60, (q) => base(Math.PI / 2 + TAU * s * q)), COL.pink, 5, 1, 12);
        polyline(range(60, (q) => up(Math.PI / 2 + TAU * s * q)), COL.pink, 5, 1, 12);
        dot(...B, 9, COL.pink, 1, 14); dot(...U2, 9, COL.pink, 1, 14);
        dot(...up(Math.PI / 2), 7, COL.white, 1);
        txt('start', up(Math.PI / 2)[0] - 50, up(Math.PI / 2)[1], { size: 18, color: COL.soft });
      }
      txt('once around below → the other sheet above', 420, 95, { size: 26, weight: 700, color: COL.pink, alpha: ease(seg(p, 0.6, 0.66)) });
      // no hole: the cover falls apart
      const na = ease(seg(p, 0.7, 0.78));
      panel(820, 230, 380, 330, 'no hole', na);
      const disk = (y, c, a) => { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(1010, y, 120, 30, 0, 0, TAU); ctx.fill(); ctx.restore(); };
      disk(330, 'rgba(201,162,255,0.45)', na); disk(400, 'rgba(201,162,255,0.45)', na); disk(500, 'rgba(255,255,255,0.25)', na);
      txt('two separate copies', 1010, 540, { size: 20, color: COL.soft, alpha: na });
      txt('twisted coverings, labelled by shift  =  H¹', 640, 650, { size: 32, weight: 700, color: COL.pink, glow: 16, alpha: ease(seg(p, 0.88, 0.94)) });
    },
  },
  {
    title: 'Covers as gluing instructions',
    text: "Let's slow down and build H one out of covers, step by step, on the simplest space: a circle. Put three copies of the circle above it, three sheets. Now cut all three at one spot, a seam, and glue them back with a rule: when you cross the seam, move up by k sheets. With k equals zero, nothing happens: you get three separate circles, the boring cover. Watch k equals one. Walk once around, cross the seam, and you're on sheet one. Again, sheet two. Again, back to zero. The three sheets have become one long spiral. Now k equals two. Walk once around, and you jump to sheet two. Again, sheet one. Again, back to zero. A spiral the other way. As shapes, the two spirals are mirror images, but we remember the direction of the shift, so one and two are different elements. So the three-sheeted twisted covers of a circle are labeled by a shift: zero, one or two. That's H one of the circle with coefficients Z mod three. On a torus, there are two independent seams, one for each loop, so two shifts: Z mod three, squared.",
    draw(p, t) {
      const CX = 400, RX = 250, RY = 46, G = 0.09;
      const Y = [430, 330, 230];                       // sheets 0, 1, 2 (bottom → top)
      const pt = (th, y) => [CX + RX * Math.cos(th), y + RY * Math.sin(th)];
      const k = p < 0.355 ? 0 : p < 0.505 ? 1 : 2;
      const a0 = ease(seg(p, 0.03, 0.08)), a1 = ease(seg(p, 0.1, 0.15));
      // base circle with the seam
      polyline(range(120, (s) => pt(TAU * s, 600)), COL.white, 3, a0, 6);
      txt('the circle', CX + RX + 70, 600, { size: 20, color: COL.dim, alpha: a0 });
      // sheets, cut at the seam (front, θ = π/2)
      Y.forEach((y, j) => {
        polyline(range(100, (s) => pt(Math.PI / 2 + G + (TAU - 2 * G) * s, y)), COL.lav, 3, a1 * 0.8, 6);
        txt(`sheet ${j}`, CX - RX - 70, y, { size: 20, color: COL.soft, alpha: a1 });
      });
      const sa = ease(seg(p, 0.15, 0.19));
      ctx.save(); ctx.setLineDash([5, 6]);
      line(CX, Y[2] + RY - 30, CX, 600 + RY + 10, COL.pink, 1.5, 0.6 * sa);
      ctx.restore();
      txt('seam', CX, 600 + RY + 30, { size: 18, color: COL.pink, alpha: sa });
      // gluing rule at the seam: arriving on sheet j (from the right) → leave on sheet j + k (to the left)
      const ga = ease(seg(p, 0.23, 0.27));
      for (let j = 0; j < 3; j++) {
        const A = pt(Math.PI / 2 - G, Y[j]), B = pt(Math.PI / 2 + G, Y[(j + k) % 3]);
        line(...A, ...B, COL.pink, 3, ga);
      }
      // walk three laps
      const startAt = k === 0 ? 0.29 : k === 1 ? 0.37 : 0.52, dur = k === 0 ? 0.06 : 0.12;   // k = 1 and k = 2 walk at the same pace
      const s = 3 * seg(p, startAt, startAt + dur);
      if (s > 0) {
        const L = Math.min(2, Math.floor(s)), fr = s - L;
        for (let l = 0; l <= L; l++) {
          const sheet = (l * k) % 3, upto = l < L ? 1 : fr;
          polyline(range(60, (q) => pt(Math.PI / 2 + G + (TAU - 2 * G) * q * upto, Y[sheet])), COL.pink, 5, 0.9, 12);
        }
        const th = Math.PI / 2 + G + (TAU - 2 * G) * fr, sheet = (L * k) % 3;
        dot(...pt(th, Y[sheet]), 10, COL.pink, 1, 16);
        dot(...pt(th, 600), 8, COL.pink, 1, 12);
      }
      // right column
      const RX2 = 990;
      txt('crossing the seam: sheet j → sheet j + k', RX2, 130, { size: 22, color: COL.soft, alpha: ga });
      const rows = [['k = 0', 'three separate circles', 0.28], ['k = 1', 'one spiral: 0 → 1 → 2 → 0', 0.355], ['k = 2', 'other way: 0 → 2 → 1 → 0', 0.505]];
      rows.forEach(([a, b, at], i) => {
        const al = ease(seg(p, at, at + 0.04)), on = (i === k);
        txt(a, RX2 - 170, 210 + i * 60, { size: 28, font: MATH, weight: 700, color: on ? COL.pink : COL.soft, alpha: al });
        txt(b, RX2 - 110, 210 + i * 60, { size: 21, align: 'left', color: on ? COL.white : COL.dim, alpha: al });
      });
      txt('mirror-image shapes, but the shift direction', RX2, 385, { size: 19, color: COL.lav, alpha: ease(seg(p, 0.64, 0.68)) });
      txt('is remembered: +1 and +2 are different', RX2, 412, { size: 19, color: COL.lav, alpha: ease(seg(p, 0.66, 0.7)) });
      txt('H¹(circle, ℤ/3) = {0, 1, 2}', RX2, 480, { size: 30, font: MATH, weight: 700, color: COL.pink, glow: 14, alpha: ease(seg(p, 0.84, 0.88)) });
      txt('torus: two seams → two shifts → (ℤ/3)²', RX2, 540, { size: 22, color: COL.lav, alpha: ease(seg(p, 0.9, 0.95)) });
    },
  },
  {
    title: 'Cut, label, glue',
    text: "Here's the same thing as a recipe, the way the actual construction works. Cut the circle into two overlapping pieces: a top piece and a bottom piece. Over each piece by itself, the cover is boring: just three flat copies. Label them zero, one, two. All the information is in how the labels match up where the pieces overlap. On the right overlap, sheet j of the top meets sheet j of the bottom: shift zero. On the left overlap, sheet j meets sheet j plus one: shift one. Now, the labels were our choice. Rename the bottom sheets by adding one. Both shifts change, to one and two, but the cover hasn't changed at all, and the difference between the shifts, the twist, is still one. So H one is: shifts on the overlaps, modulo relabeling the pieces. That's exactly the walls modulo coboundaries from the cohomology video. And notice: this recipe never draws a single loop.",
    draw(p) {
      const C = [400, 380], R = [120, 165, 210];
      const W = 0.32;                                           // overlap half-width (radians)
      const P = (r, th) => [C[0] + r * Math.cos(th), C[1] - r * Math.sin(th)];
      const arc = (r, t0, t1) => range(60, (s) => P(r, lerp(t0, t1, s)));
      const ua = ease(seg(p, 0.09, 0.14)), va = ease(seg(p, 0.12, 0.17));
      // overlap wedges
      const oa = ease(seg(p, 0.12, 0.17));
      for (const th of [0, Math.PI]) {
        ctx.save(); ctx.globalAlpha = 0.12 * oa; ctx.fillStyle = COL.white;
        ctx.beginPath(); ctx.moveTo(...P(95, th - W)); ctx.lineTo(...P(235, th - W)); ctx.lineTo(...P(235, th + W)); ctx.lineTo(...P(95, th + W)); ctx.closePath(); ctx.fill(); ctx.restore();
      }
      txt('overlap', P(300, 0)[0], C[1] - 38, { size: 18, color: COL.dim, alpha: oa });
      txt('overlap', P(300, Math.PI)[0], C[1] - 38, { size: 18, color: COL.dim, alpha: oa });
      // the top piece: sheets are arcs over (W, π − W); the bottom piece: (π + W, 2π − W)
      R.forEach((r, j) => {
        polyline(arc(r, W, Math.PI - W), COL.pink, 4, ua, 8);
        polyline(arc(r, Math.PI + W, TAU - W), COL.lav, 4, va, 8);
      });
      txt('top piece', C[0], C[1] - 245, { size: 20, color: COL.pink, alpha: ua });
      txt('bottom piece', C[0], C[1] + 245, { size: 20, color: COL.lav, alpha: va });
      // labels: top fixed; bottom relabelled by c
      const c = p < 0.61 ? 0 : 1;
      const la = ease(seg(p, 0.2, 0.26));
      R.forEach((r, j) => {
        dot(...P(r, Math.PI / 2), 13, COL.pink, la);
        txt(String(j), ...P(r, Math.PI / 2), { size: 16, weight: 700, color: COL.bg, alpha: la });
        const flash = c && p < 0.67 ? 1 + 0.4 * Math.sin((p - 0.61) * 200) : 1;
        dot(...P(r, 3 * Math.PI / 2), 13 * flash, COL.lav, la);
        txt(String((j + c) % 3), ...P(r, 3 * Math.PI / 2), { size: 16, weight: 700, color: COL.bg, alpha: la });
      });
      // gluing in the overlaps (geometry fixed): right: same radius; left: radius j → j + 1
      const g1 = ease(seg(p, 0.38, 0.43)), g2 = ease(seg(p, 0.49, 0.54));
      R.forEach((r, j) => {
        line(...P(r, W), ...P(r, -W), COL.white, 2.5, g1);
        line(...P(r, Math.PI - W), ...P(R[(j + 1) % 3], Math.PI + W), COL.white, 2.5, g2);
      });
      const sR = c, sL = 1 + c;
      txt(`shift +${sR}`, ...P(330, 0), { size: 24, font: MATH, weight: 700, color: COL.pink, alpha: g1 });
      txt(`shift +${sL}`, ...P(330, Math.PI), { size: 24, font: MATH, weight: 700, color: COL.pink, alpha: g2 });
      // right column
      const RX = 960;
      txt('1. cut X into overlapping pieces', RX, 150, { size: 22, alpha: ease(seg(p, 0.09, 0.14)) });
      txt('2. over each piece: plain copies, labelled', RX, 195, { size: 22, alpha: ease(seg(p, 0.18, 0.23)) });
      txt('3. record the shift on each overlap', RX, 240, { size: 22, alpha: ease(seg(p, 0.38, 0.43)) });
      txt(`twist = left − right = ${sL} − ${sR} = 1`, RX, 330, { size: 26, font: MATH, weight: 700, color: COL.lav, alpha: ease(seg(p, 0.53, 0.57)) });
      txt('rename the bottom sheets (+1):', RX, 400, { size: 20, color: COL.soft, alpha: ease(seg(p, 0.61, 0.65)) });
      txt('shifts change, the cover doesn’t', RX, 432, { size: 20, color: COL.soft, alpha: ease(seg(p, 0.66, 0.7)) });
      txt('H¹ = shifts on overlaps', RX, 510, { size: 30, weight: 700, color: COL.pink, glow: 14, alpha: ease(seg(p, 0.81, 0.85)) });
      txt('modulo relabelling', RX, 550, { size: 30, weight: 700, color: COL.pink, glow: 14, alpha: ease(seg(p, 0.83, 0.87)) });
      txt('(walls mod coboundaries, video 3) · no loops needed', RX, 605, { size: 18, color: COL.dim, alpha: ease(seg(p, 0.9, 0.94)) });
    },
  },
  {
    title: 'Square roots mod p',
    text: "So why does this need a new topology mod p? Here's a concrete example. Take the line with the point zero removed, and the cover given by square root of x: two sheets, plus and minus root x. Over the complex numbers, walking around zero swaps the two sheets, just like in video one. Now go mod seven. One, two and four have square roots; three, five and six don't. Either way, there's no formula for square root of x on any piece of the line: it isn't a polynomial or a fraction in x, even though some numbers happen to have roots. So with the old pieces, the recipe never even gets started.",
    draw(p) {
      // left: the table of square roots mod 7
      const a0 = ease(seg(p, 0.04, 0.1));
      txt('X = line minus 0     cover: ±√x', 380, 100, { size: 26, font: MATH, alpha: a0 });
      txt('over ℂ: loop around 0 swaps the sheets (video 1)', 380, 145, { size: 19, color: COL.dim, alpha: ease(seg(p, 0.33, 0.37)) });
      // opening picture (over ℂ): walking x once around 0 swaps the two square roots
      const va = ease(seg(p, 0.05, 0.1)) * (1 - ease(seg(p, 0.5, 0.53)));
      if (va > 0) {
        const XC = [230, 370], RC = [560, 370], RR = 115;
        panel(90, 190, 280, 340, 'x  (0 removed)', va);
        panel(420, 190, 280, 340, '√x : two sheets', va);
        dot(...XC, 7, COL.bg, va); ring(...XC, 7, COL.pink, va, 2);
        txt('0', XC[0] + 16, XC[1] + 16, { size: 16, color: COL.dim, alpha: va });
        dot(...RC, 4, COL.dim, va);
        const lap = seg(p, 0.3, 0.47), th = TAU * lap;
        const ring1 = (C, r, t0, t1) => range(80, (s) => { const q = lerp(t0, t1, s); return [C[0] + r * Math.cos(q), C[1] - r * Math.sin(q)]; });
        polyline(ring1(XC, RR, 0, TAU), COL.white, 1.5, 0.25 * va);
        if (lap > 0) polyline(ring1(XC, RR, 0, th), COL.pink, 4, va, 10);
        dot(XC[0] + RR * Math.cos(th), XC[1] - RR * Math.sin(th), 9, COL.pink, va, 14);
        txt('x', XC[0] + RR * Math.cos(th) + 18, XC[1] - RR * Math.sin(th) - 14, { size: 20, font: MATH, italic: true, alpha: va });
        // roots at angle θ/2 and θ/2 + π
        const r2 = RR * 0.85;
        if (lap > 0) {
          polyline(ring1(RC, r2, 0, th / 2), COL.pink, 4, va, 10);
          polyline(ring1(RC, r2, Math.PI, Math.PI + th / 2), COL.lav, 4, va, 10);
        }
        const A = [RC[0] + r2 * Math.cos(th / 2), RC[1] - r2 * Math.sin(th / 2)];
        const B = [RC[0] + r2 * Math.cos(th / 2 + Math.PI), RC[1] - r2 * Math.sin(th / 2 + Math.PI)];
        dot(...A, 10, COL.pink, va, 14); dot(...B, 10, COL.lav, va, 14);
        txt('+√x', A[0] + 30, A[1] - 16, { size: 20, font: MATH, color: COL.pink, alpha: va });
        txt('−√x', B[0] - 30, B[1] + 18, { size: 20, font: MATH, color: COL.lav, alpha: va });
        txt('x goes around once → the roots trade places', 395, 570, { size: 21, weight: 700, color: COL.pink, alpha: ease(seg(p, 0.45, 0.48)) * va });
      }
      const ta = ease(seg(p, 0.5, 0.53));
      txt('x mod 7', 220, 200, { size: 20, color: COL.soft, alpha: ta });
      txt('√x', 470, 200, { size: 22, font: MATH, color: COL.soft, alpha: ta });
      const roots = { 1: '1, 6', 2: '3, 4', 4: '2, 5' };
      for (let x = 1; x <= 6; x++) {
        const has = x in roots, at = has ? 0.51 : 0.57, a = ease(seg(p, at, at + 0.03));
        txt(String(x), 220, 200 + x * 42, { size: 26, font: MATH, alpha: a });
        txt(has ? roots[x] : 'none', 470, 200 + x * 42, { size: 26, font: MATH, color: has ? COL.pink : COL.dim, alpha: a });
